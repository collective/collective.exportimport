# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[build-system]
requires = ["setuptools>=68.2,<83", "wheel"]

# START-MARKER-MANUAL-CONFIG
# Anything from here until END-MARKER-MANUAL-CONFIG
# will be kept by plone.meta

[project]
name = "collective.exportimport"
version = "2.0.0.dev0"
description = "An add-on for Plone to Export and import content, members, relations, translations and localroles."
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Plone",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: 6.2",
    "Framework :: Plone :: Addon",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "GPL-2.0-only"
dynamic = ["readme"]
requires-python = ">=3.10"
authors = [
    {name = "Philip Bauer (for starzel.de)",email = "info@starzel.de"},
]
dependencies = [
    "beautifulsoup4",
    "hurry.filesize",
    "ijson",
    "plone.api >= 1.8.4",
    "plone.app.contenttypes",
    "plone.app.layout",
    "plone.app.portlets",
    "plone.app.redirector",
    "plone.app.textfield",
    "plone.app.uuid",
    "plone.dexterity",
    "plone.i18n",
    "plone.namedfile",
    "plone.portlets",
    "plone.registry",
    "plone.restapi",
    "plone.schema",
    "plone.uuid",
    "Products.CMFCore",
    "Products.CMFPlone",
    "Products.ZCatalog",
    "python-dateutil",
    "Zope",
    "zope.annotation",
    "zope.component",
    "zope.container",
    "zope.event",
    "zope.globalrequest",
    "zope.i18n",
    "zope.i18nmessageid",
    "zope.interface",
    "zope.lifecycleevent",
    "zope.schema",
]
keywords = ["Python", "Plone", "CMS"]

[project.scripts]
update_locale = "collective.exportimport.locales.update:update_locale"

[project.entry-points."plone.autoinclude.plugin"]
target = "plone"

[project.optional-dependencies]
test = [
    "plone.app.contenttypes[test]",
    "plone.app.discussion",
    "plone.app.testing",
    "plone.classicui",
    "plone.testing",
    "z3c.relationfield",
    "zope.intid",
]

[project.urls]
PyPI = "https://pypi.org/project/collective.exportimport"
Source = "https://github.com/collective/collective.exportimport"
Issues = "https://github.com/collective/collective.exportimport/issues"
Documentation = "https://github.com/collective/collective.exportimport#readme"
Changelog = "https://github.com/collective/collective.exportimport/blob/main/CHANGES.rst"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CONTRIBUTORS.rst", "CHANGES.rst"]}
# END-MARKER-MANUAL-CONFIG

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  towncrier_extra_lines = """
#  extra_configuration
#  """
##

[tool.isort]
profile = "plone"

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  isort_extra_lines = """
#  extra_configuration
#  """
##

[tool.black]
target-version = ["py310"]

##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  black_extra_lines = """
#  extra_configuration
#  """
##

[tool.codespell]
ignore-words-list = "discreet,assertin,thet,openend,archiv"
skip = "*.po,"
##
# Add extra configuration options in .meta.toml:
#  [pyproject]
#  codespell_ignores = "foo,bar"
#  codespell_skip = "*.po,*.map,package-lock.json"
##

[tool.dependencychecker]
Zope = [
  # Zope own provided namespaces
  'App', 'OFS', 'Products.Five', 'Products.OFSP', 'Products.PageTemplates',
  'Products.SiteAccess', 'Shared', 'Testing', 'ZPublisher', 'ZTUtils',
  'Zope2', 'webdav', 'zmi',
  # ExtensionClass own provided namespaces
  'ExtensionClass', 'ComputedAttribute', 'MethodObject',
  # Zope dependencies
  'AccessControl', 'Acquisition', 'AuthEncoding', 'beautifulsoup4', 'BTrees',
  'cffi', 'Chameleon', 'DateTime', 'DocumentTemplate',
  'MultiMapping', 'multipart', 'PasteDeploy', 'Persistence', 'persistent',
  'pycparser', 'python-gettext', 'pytz', 'RestrictedPython', 'roman',
  'soupsieve', 'transaction', 'waitress', 'WebOb', 'WebTest', 'WSGIProxy2',
  'z3c.pt', 'zc.lockfile', 'ZConfig', 'zExceptions', 'ZODB', 'zodbpickle',
  'zope.annotation', 'zope.browser', 'zope.browsermenu', 'zope.browserpage',
  'zope.browserresource', 'zope.cachedescriptors', 'zope.component',
  'zope.configuration', 'zope.container', 'zope.contentprovider',
  'zope.contenttype', 'zope.datetime', 'zope.deferredimport',
  'zope.deprecation', 'zope.dottedname', 'zope.event', 'zope.exceptions',
  'zope.filerepresentation', 'zope.globalrequest', 'zope.hookable',
  'zope.i18n', 'zope.i18nmessageid', 'zope.interface', 'zope.lifecycleevent',
  'zope.location', 'zope.pagetemplate', 'zope.processlifetime', 'zope.proxy',
  'zope.ptresource', 'zope.publisher', 'zope.schema', 'zope.security',
  'zope.sequencesort', 'zope.site', 'zope.size', 'zope.structuredtext',
  'zope.tal', 'zope.tales', 'zope.testbrowser', 'zope.testing',
  'zope.traversing', 'zope.viewlet'
]
'Products.CMFCore' = [
  'docutils', 'five.localsitemanager', 'Missing', 'Products.BTreeFolder2',
  'Products.GenericSetup', 'Products.MailHost', 'Products.PythonScripts',
  'Products.StandardCacheManagers', 'Products.ZCatalog', 'Record',
  'zope.sendmail', 'Zope'
]
'plone.base' = [
  'plone.batching', 'plone.registry', 'plone.schema','plone.z3cform',
  'Products.CMFCore', 'Products.CMFDynamicViewFTI',
]
python-dateutil = ['dateutil']
pytest-plone = ['pytest', 'zope.pytestlayer', 'plone.testing', 'plone.app.testing']
ignore-packages = ['collective.relationhelpers', 'plone.app.blob', 'plone.app.discussion', 'plone.app.multilingual', 'plone.app.querystring', 'plone.app.versioningbehavior', 'plone.classicui', 'Products.Archetypes', 'Products.ATContentTypes', 'Products.LinguaPlone', 'Products.TALESField', 'z3c.relationfield', 'zc.relation']
beautifulsoup4 = ['bs4']

